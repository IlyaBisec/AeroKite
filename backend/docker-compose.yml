version: "3.9"

services:
  db:
    image: postgres:15
    container_name: aerokite_db
    restart: always
    environment:
      POSTGRES_DB: aerokite
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    container_name: aerokite_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: .
    container_name: aerokite_backend
    depends_on:
      - db
      - minio
    ports:
      - "8000:8000"
